workflows:
  android-release:
    name: Glideboard Android Release (AAB)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - google_play
      # Reference name of the keystore uploaded in Codemagic under
      # Teams/Personal account -> Code signing identities -> Android keystores.
      # Codemagic exports CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD /
      # CM_KEY_ALIAS / CM_KEY_PASSWORD, which the Expo config plugin at
      # plugins/withAndroidReleaseSigning.js reads in build.gradle.
      android_signing:
        - glideboard_keystore
      node: 20.18.0
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.bun/install/cache
    scripts:
      - name: Install bun
        script: |
          curl -fsSL https://bun.sh/install | bash
          # $CM_ENV takes plain KEY=value lines — "export KEY=value" is NOT parsed,
          # which is why bun was missing from PATH in later steps.
          echo "PATH=$HOME/.bun/bin:$PATH" >> $CM_ENV
          # Export for this step too, so the check below runs against the new PATH.
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Verify bun is on PATH
        script: |
          command -v bun >/dev/null 2>&1 \
            || { echo "FAIL: bun still not on PATH after install step"; exit 1; }
          echo "OK: bun $(bun --version) at $(command -v bun)"

      - name: Install dependencies
        script: bun install --frozen-lockfile

      - name: Expo prebuild (android)
        script: npx expo prebuild --platform android --clean

      - name: Assert release signing was injected
        script: |
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle \
            || { echo "FAIL: release signingConfig missing — config plugin did not run"; exit 1; }
          grep -q 'CM_KEYSTORE_PATH' android/app/build.gradle \
            || { echo "FAIL: keystore env wiring missing from build.gradle"; exit 1; }
          echo "OK: release signingConfig present"

      - name: Configure Android SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build AAB
        script: cd android && ./gradlew bundleRelease

      - name: Assert AAB is not debug-signed
        script: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if jarsigner -verify -certs "$AAB" | grep -qi 'CN=Android Debug'; then
            echo "FAIL: AAB is still signed with the Android debug key"
            exit 1
          fi
          echo "OK: AAB is release-signed"
          jarsigner -verify -certs "$AAB" | grep -m1 -i 'X.509' || true

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GPC_AUTH_JSON
        track: internal
        submit_as_draft: true
