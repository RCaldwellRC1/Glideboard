workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.robertcaldwell.vibecode"
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Expo prebuild
        script: |
          npx expo prebuild --platform android --clean
      - name: Configure Android Gradle & Kotlin Version
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "kotlinVersion=2.1.20" >> android/gradle.properties
          echo "android.kotlinVersion=2.1.20" >> android/gradle.properties
          # Force Kotlin compiler plugin version inside build.gradle
          sed -i '' 's/kotlin-gradle-plugin:[0-9.]*/kotlin-gradle-plugin:2.1.20/g' android/build.gradle || true
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease -Pandroid.kotlinVersion=2.1.20 -PkotlinVersion=2.1.20
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
