workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.robertcaldwell.vibecode"
        GRADLE_OPTS: "-DkotlinVersion=2.1.20 -Dandroid.kotlinVersion=2.1.20"
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Expo prebuild
        script: |
          npx expo prebuild --platform android --clean
      - name: Configure Android SDK & Skip Metadata Version Checks
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "kotlinVersion=2.1.20" >> android/gradle.properties
          echo "android.kotlinVersion=2.1.20" >> android/gradle.properties

          # Create global init script to bypass metadata version checks and disable androidSourcesJar
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/00-kotlin-override.gradle
          gradle.projectsLoaded { gradle ->
              gradle.rootProject.allprojects {
                  tasks.matching { it.name == "androidSourcesJar" }.configureEach {
                      enabled = false
                  }
                  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions {
                          freeCompilerArgs += ["-Xskip-metadata-version-check"]
                      }
                  }
              }
          }
          EOF

          # Inject kotlinVersion into android/build.gradle rootProject.ext
          python3 -c '
          with open("android/build.gradle", "r") as f:
              content = f.read()

          patch = """
          buildscript {
              ext {
                  kotlinVersion = "2.1.20"
              }
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("2.1.20")
                      }
                  }
              }
          }
          """

          with open("android/build.gradle", "w") as f:
              f.write(patch + "\n" + content)
          '
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease -Pandroid.kotlinVersion=2.1.20 -PkotlinVersion=2.1.20 -Pkotlin.compiler.freeCompilerArgs="-Xskip-metadata-version-check"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
