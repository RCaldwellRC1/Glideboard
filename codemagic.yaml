workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.robertcaldwell.vibecode"
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Expo prebuild
        script: |
          npx expo prebuild --platform android --clean
      - name: Configure Android SDK & Force Kotlin 2.1.20 via Settings
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "kotlinVersion=2.1.20" >> android/gradle.properties
          echo "android.kotlinVersion=2.1.20" >> android/gradle.properties

          python3 -c '
          # Disable androidSourcesJar task in android/build.gradle
          with open("android/build.gradle", "r") as f:
              content = f.read()
          patch = """
          allprojects {
              tasks.matching { it.name == "androidSourcesJar" }.configureEach {
                  enabled = false
              }
          }
          """
          with open("android/build.gradle", "w") as f:
              f.write(patch + "\n" + content)

          # Inject pluginResolutionStrategy into android/settings.gradle to force Kotlin 2.1.20 globally
          with open("android/settings.gradle", "r") as f:
              settings_content = f.read()
          settings_patch = """
          pluginManagement {
              resolutionStrategy {
                  eachPlugin {
                      if (requested.id.id.startsWith("org.jetbrains.kotlin")) {
                          useVersion("2.1.20")
                      }
                  }
              }
          }
          """
          with open("android/settings.gradle", "w") as f:
              f.write(settings_patch + "\n" + settings_content)
          '
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease -Pandroid.kotlinVersion=2.1.20 -PkotlinVersion=2.1.20
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
