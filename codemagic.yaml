workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.robertcaldwell.vibecode"
        GRADLE_OPTS: "-DkotlinVersion=2.1.20 -Dandroid.kotlinVersion=2.1.20 -Dkotlin.compiler.freeCompilerArgs=-Xskip-metadata-version-check"
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Expo prebuild
        script: |
          npx expo prebuild --platform android --clean
      - name: Configure Android SDK & Global Gradle Init Script
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "kotlinVersion=2.1.20" >> android/gradle.properties
          echo "android.kotlinVersion=2.1.20" >> android/gradle.properties

          # Create a global init script that forces Kotlin 2.1.20 across all buildscript & root plugin dependencies
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/force-kotlin.gradle
          gradle.beforeSettings { settings ->
              settings.pluginManagement {
                  plugins {
                      id 'org.jetbrains.kotlin.jvm' version '2.1.20'
                      id 'org.jetbrains.kotlin.android' version '2.1.20'
                  }
              }
          }
          gradle.allprojects {
              buildscript {
                  configurations.all {
                      resolutionStrategy.eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin') {
                              details.useVersion('2.1.20')
                          }
                      }
                  }
              }
          }
          EOF
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease -Pandroid.kotlinVersion=2.1.20 -PkotlinVersion=2.1.20
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
