workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.robertcaldwell.vibecode"
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Expo prebuild
        script: |
          npx expo prebuild --platform android --clean
      - name: Configure Android SDK, Gradle & Global Kotlin Init Script
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "kotlinVersion=2.1.20" >> android/gradle.properties
          echo "android.kotlinVersion=2.1.20" >> android/gradle.properties
          
          # Patch node_modules Kotlin plugin references
          find node_modules -name "build.gradle*" -exec sed -i '' 's/1\.9\.[0-9]*/2.1.20/g' {} + || true

          # Create global Gradle init script to skip Kotlin metadata version checks everywhere
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/kotlin.gradle
          gradle.allprojects {
              tasks.matching { it.class.name.contains("KotlinCompile") }.configureEach {
                  kotlinOptions {
                      freeCompilerArgs += ["-Xskip-metadata-version-check"]
                  }
              }
          }
          EOF
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease -Pandroid.kotlinVersion=2.1.20 -PkotlinVersion=2.1.20
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
